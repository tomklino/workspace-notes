---
- name: List Git tags in version order
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ notes_image_source_dir }}"
      - tag
      - --sort=-version:refname
  register: notes_image_git_tags_result
  changed_when: false

- name: Require at least one Git tag
  ansible.builtin.assert:
    that:
      - notes_image_git_tags_result.stdout_lines | length > 0
    fail_msg: "Create and push a Git release tag before building a deployment image"

- name: Publish image facts
  ansible.builtin.set_fact:
    notes_image_git_tag: "{{ notes_image_git_tags_result.stdout_lines[0] }}"
    notes_image_reference: >-
      {{ notes_image_repository }}:{{ notes_image_git_tags_result.stdout_lines[0] }}

- name: Check whether the tagged image exists in the public registry
  ansible.builtin.command:
    argv:
      - docker
      - manifest
      - inspect
      - "{{ notes_image_reference }}"
  register: notes_image_manifest_result
  changed_when: false
  failed_when: false

- name: Require the release image to exist for deployment
  when:
    - notes_image_manifest_result.rc != 0
    - not (notes_image_build_missing | bool)
  ansible.builtin.fail:
    msg: >-
      {{ notes_image_reference }} does not exist. Run playbooks/build-image.yml
      before deploying.

- name: Build and publish missing image
  when:
    - notes_image_manifest_result.rc != 0
    - notes_image_build_missing | bool
  block:
    - name: Validate automatic Docker Hub repository creation
      when: notes_image_create_repository | bool
      ansible.builtin.assert:
        that:
          - notes_image_repository.split('/') | length == 3
          - notes_image_repository.split('/')[0] in ['docker.io', 'index.docker.io']
        fail_msg: >-
          Automatic repository creation supports Docker Hub repositories named
          docker.io/NAMESPACE/REPOSITORY.

    - name: Read the Docker CLI configuration
      when:
        - notes_image_create_repository | bool
        - notes_image_registry_username | length == 0
      ansible.builtin.slurp:
        src: "{{ notes_image_docker_config_path }}"
      register: notes_image_docker_config_result
      no_log: true

    - name: Decode the active Docker Hub credentials
      when:
        - notes_image_create_repository | bool
        - notes_image_registry_username | length == 0
      ansible.builtin.set_fact:
        notes_image_docker_hub_auth: >-
          {{ (((notes_image_docker_config_result.content | b64decode | from_json).auths
               | default({})).get('https://index.docker.io/v1/', {}).auth
              | default('')) | b64decode }}
      no_log: true

    - name: Require credentials from Docker login or role variables
      when: notes_image_create_repository | bool
      ansible.builtin.assert:
        that:
          - >-
            (notes_image_registry_username | length > 0
             and notes_image_registry_password | length > 0)
            or ':' in (notes_image_docker_hub_auth | default(''))
        fail_msg: >-
          Run docker login, or set notes_image_registry_username and
          notes_image_registry_password.

    - name: Select Docker Hub API credentials
      when: notes_image_create_repository | bool
      ansible.builtin.set_fact:
        notes_image_docker_hub_username: >-
          {{ notes_image_registry_username
             if notes_image_registry_username | length > 0
             else notes_image_docker_hub_auth.split(':', 1)[0] }}
        notes_image_docker_hub_password: >-
          {{ notes_image_registry_password
             if notes_image_registry_username | length > 0
             else notes_image_docker_hub_auth.split(':', 1)[1] }}
      no_log: true

    - name: Authenticate with the Docker Hub API
      when: notes_image_create_repository | bool
      ansible.builtin.uri:
        url: "{{ notes_image_docker_hub_api_url }}/users/login/"
        method: POST
        body_format: json
        body:
          username: "{{ notes_image_docker_hub_username }}"
          password: "{{ notes_image_docker_hub_password }}"
        status_code: 200
        return_content: true
      register: notes_image_docker_hub_login
      no_log: true

    - name: Check whether the Docker Hub repository exists
      when: notes_image_create_repository | bool
      ansible.builtin.uri:
        url: >-
          {{ notes_image_docker_hub_api_url }}/repositories/{{ notes_image_repository.split('/')[1] }}/{{ notes_image_repository.split('/')[2] }}/
        method: GET
        headers:
          Authorization: "JWT {{ notes_image_docker_hub_login.json.token }}"
        status_code:
          - 200
          - 404
      register: notes_image_repository_result
      no_log: true

    - name: Create the Docker Hub repository
      when:
        - notes_image_create_repository | bool
        - notes_image_repository_result.status == 404
      ansible.builtin.uri:
        url: >-
          {{ notes_image_docker_hub_api_url }}/repositories/{{ notes_image_repository.split('/')[1] }}/
        method: POST
        headers:
          Authorization: "JWT {{ notes_image_docker_hub_login.json.token }}"
        body_format: json
        body:
          name: "{{ notes_image_repository.split('/')[2] }}"
          namespace: "{{ notes_image_repository.split('/')[1] }}"
          description: "{{ notes_image_repository_description }}"
          is_private: "{{ notes_image_repository_private | bool }}"
        status_code:
          - 201
          - 202
      changed_when: true
      no_log: true

    - name: Create temporary tagged source checkout
      ansible.builtin.tempfile:
        state: directory
        prefix: workspace-notes-image-
      register: notes_image_checkout

    - name: Check out the selected tag without changing the working tree
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ notes_image_source_dir }}"
          - worktree
          - add
          - --detach
          - "{{ notes_image_checkout.path }}"
          - "{{ notes_image_git_tag }}"
      changed_when: true

    - name: Log in to the image registry
      when: notes_image_registry_username | length > 0
      community.docker.docker_login:
        registry_url: "{{ notes_image_repository.split('/')[0] }}"
        username: "{{ notes_image_registry_username }}"
        password: "{{ notes_image_registry_password }}"

    - name: Build locally and push the tagged image
      ansible.builtin.command:
        argv:
          - docker
          - buildx
          - build
          - --platform
          - "{{ notes_image_platform }}"
          - --tag
          - "{{ notes_image_reference }}"
          - --push
          - "{{ notes_image_checkout.path }}"
      changed_when: true

  always:
    - name: Remove temporary Git worktree
      when: notes_image_checkout.path is defined
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ notes_image_source_dir }}"
          - worktree
          - remove
          - --force
          - "{{ notes_image_checkout.path }}"
      changed_when: true

- name: Report existing tagged image
  when: notes_image_manifest_result.rc == 0
  ansible.builtin.debug:
    msg: "Using existing registry image {{ notes_image_reference }}"
