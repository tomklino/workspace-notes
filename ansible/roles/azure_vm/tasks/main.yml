---
- name: Validate Azure VM configuration
  ansible.builtin.assert:
    that:
      - azure_vm_resource_group | length > 0
      - azure_vm_location | length > 0
      - azure_vm_name | length > 0
      - azure_vm_admin_username | length > 0

- name: Ensure resource group exists
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ azure_vm_resource_group }}"
    location: "{{ azure_vm_location }}"

- name: Ensure virtual network exists
  azure.azcollection.azure_rm_virtualnetwork:
    resource_group: "{{ azure_vm_resource_group }}"
    name: "{{ azure_vm_vnet_name }}"
    address_prefixes: "{{ azure_vm_vnet_address_prefixes }}"

- name: Ensure subnet exists
  azure.azcollection.azure_rm_subnet:
    resource_group: "{{ azure_vm_resource_group }}"
    virtual_network_name: "{{ azure_vm_vnet_name }}"
    name: "{{ azure_vm_subnet_name }}"
    address_prefix: "{{ azure_vm_subnet_prefix }}"

- name: Ensure network security group exists
  azure.azcollection.azure_rm_securitygroup:
    resource_group: "{{ azure_vm_resource_group }}"
    name: "{{ azure_vm_nsg_name }}"
    rules:
      - name: allow-ssh
        protocol: Tcp
        destination_port_range: "{{ workspace_notes_ssh_port }}"
        access: Allow
        priority: 100
        direction: Inbound
      - name: allow-http
        protocol: Tcp
        destination_port_range: "{{ workspace_notes_http_port }}"
        access: Allow
        priority: 110
        direction: Inbound
      - name: allow-https
        protocol: Tcp
        destination_port_range: "{{ workspace_notes_https_port }}"
        access: Allow
        priority: 120
        direction: Inbound

- name: Ensure static public IP exists
  azure.azcollection.azure_rm_publicipaddress:
    resource_group: "{{ azure_vm_resource_group }}"
    allocation_method: Static
    sku: Standard
    name: "{{ azure_vm_public_ip_name }}"
  register: azure_vm_public_ip_result

- name: Ensure network interface exists
  azure.azcollection.azure_rm_networkinterface:
    resource_group: "{{ azure_vm_resource_group }}"
    name: "{{ azure_vm_nic_name }}"
    virtual_network: "{{ azure_vm_vnet_name }}"
    subnet_name: "{{ azure_vm_subnet_name }}"
    security_group: "{{ azure_vm_nsg_name }}"
    ip_configurations:
      - name: ipconfig1
        public_ip_address_name: "{{ azure_vm_public_ip_name }}"
        primary: true

- name: Read SSH public key
  ansible.builtin.set_fact:
    azure_vm_ssh_public_key_value: "{{ lookup('file', azure_vm_admin_ssh_public_key) }}"

- name: Ensure VM exists
  azure.azcollection.azure_rm_virtualmachine:
    resource_group: "{{ azure_vm_resource_group }}"
    name: "{{ azure_vm_name }}"
    vm_size: "{{ azure_vm_size }}"
    admin_username: "{{ azure_vm_admin_username }}"
    ssh_password_enabled: false
    network_interfaces: "{{ azure_vm_nic_name }}"
    image: "{{ azure_vm_image }}"
    ssh_public_keys:
      - path: "/home/{{ azure_vm_admin_username }}/.ssh/authorized_keys"
        key_data: "{{ azure_vm_ssh_public_key_value }}"

- name: Publish VM address
  ansible.builtin.set_fact:
    azure_vm_public_ip: "{{ azure_vm_public_ip_result.state.ip_address }}"
